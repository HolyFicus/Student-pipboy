    <script>
      // Restore URL from 404.html redirect on GitHub Pages
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

  <body class="bg-[#050c06] text-[#22c55e] select-none">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Service worker registration with relative scope for GitHub Pages compatibility
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg fail:', err));
        });
      }
    </script>
  </body>
